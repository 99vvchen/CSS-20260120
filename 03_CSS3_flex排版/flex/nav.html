<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>RWD主導覽練習檔</title>
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Dosis&family=Mukta:wght@300&display=swap');
        /* font-family: 'Mukta', sans-serif; 
            font-family: 'Dosis';
        */
        /* 電腦與平板上應用的樣式 */
        *{
            box-sizing: border-box;
            text-decoration: none;
        }
        body {
            background-color: rgb(237, 237, 237);
            margin: 0px;
            font-size: 16px;
            font-family: 'Mukta', sans-serif;
          
        }

        /* 手機 */
        @media screen and (max-width: 500px) {

           
        }
        header{
            background-color: #333;
            /* height: 50px; */
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .logo{
            width: 100px;
            height: 50px;
            background-color: red;
            
        }
        .logo a{
            width: 100%;
            height: 100%;
           color: white;
           font-weight: bold;
           font-size: 20px;
           display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu-icon{
            color: rgb(255, 255, 255);
            display: none;
        }
        
        .navbar>ul{
            margin: 0;
            padding: 0;
            display: flex;
           gap: 20px;
           
        }
        .navbar ul li{
            display: flex;
            width: 100px;
            height: 50px;
            list-style-type: none;
            background-color: purple;
            justify-content: center;
            align-items: center;
            
           
            
        }
        .navbar ul li a{
            /* width: 100%;
            height: 100%; */
            display: block;
            text-align: center;
            color: rgb(255, 255, 255);
            /* background-color: #ccff41; */
            
            
            
        }
        .navbar ul li a:hover{
            color: red;
            
        }
        @media screen and (max-width: 500px){
            .header{
                flex-wrap: wrap;
            }
            .menu-icon{
                display: flex;
            }
            .navbar{
                width: 100%;
            }
            .navbar ul{
                flex-wrap: wrap;
            }
            .navbar ul li{
                flex-wrap: wrap;
            }

        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="#">mimimi</a></div>
        <div class="menu-icon"><i class="fa-solid fa-bars-staggered"></i></div>
            <nav class="navbar">
                    <ul>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Experience</a></li>
                        <li><a href="#">Portfolio</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
               </nav>
    </header>


</body>

</html>
