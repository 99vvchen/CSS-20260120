<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Path範例</title>
    <style>
        .container {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  width: 80%;
  margin: 0 auto;
  padding: 50px 0;
}

.item {
  width: 300px;
  height: 300px;
  background-size: cover;
  background-position: center center;
  transition: all 0.3s ease-in-out;
}

.item-1 {
  background-image: url("../imgs/sea-turtle.jpeg");
  clip-path: circle(50%);
}

.item-2 {
  background-image: url("../imgs/red-sea.jpeg");
  clip-path: ellipse(25% 40% at 50% 50%);
}

.item-3 {
  background-image: url("../imgs/sea1.jpeg");
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

.item-4 {
  background-image: url("../imgs/sea2.jpeg");
  clip-path: path("M210.5,70.2c0,58.1-105.2,105.2-105.2,105.2S0,128.4,0,70.2S74-22,105.2,40C153-27,210.5,12.1,210.5,70.2z");
}

.item:hover {
  transform: scale(1.2);
}
.pic{
  width: 500px;
  height:500px;
  background-image: url("../../homework/0110imgs/cake.jpg") no-rep;

  /* 這是網路上小工具 */
  /* clip-path: polygon(9% 12%, 84% 0, 100% 75%, 76% 80%, 75% 100%, 40% 84%, 8% 68%); */
  
  /* figma輸出svg後複製d用法 */
  clip-path: path("M198.791 7.63498C226.361 12.6701 248.817 28.9085 275.198 38.3494C311.298 51.2688 358.297 43.518 382.338 73.3214C406.293 103.019 406.314 148.96 393.338 184.81C381 218.898 341.23 232.166 315.56 257.819C292.22 281.142 281.418 320.684 249.366 328.685C217.303 336.689 189.367 305.894 157.462 297.284C124.585 288.411 86.9721 297.288 59.3562 277.406C29.2964 255.765 7.96153 221.618 1.73442 185.17C-4.55852 148.337 6.95371 110.482 25.268 77.8862C42.6954 46.8693 68.9675 20.0913 102.001 6.71768C132.514 -5.63572 166.398 1.71886 198.791 7.63498Z");
}

    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1"></div>
        <div class="item item-2"></div>
        <div class="item item-3"></div>
        <div class="item item-4"></div>
        <div class="pic"></div>
      </div>
</body>
</html>
