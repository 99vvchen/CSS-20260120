<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS變數練習</title>
    <style>
        :root {
            --main-color: #008080;
            --main-bg-color: rgb(255, 224, 122);
            --main-font-size: 16px;
            --card-width:200px;
            --card-hight:100px;
        }

        /* 使用變數來定義CSS屬性值 */
        body {
            background-color: var(--main-bg-color);
            color: var(--main-color);
            font-size: var(--main-font-size);
        }

        /* 修改變數值 */
        p {
            --main-color: #ff0000;
            color: var(--main-color);
        }
        .box1,.box2,.box3{
            width: var(--card-width);
            height: var(--card-hight);
            margin: 20px;
            
        }

        .box1{
            background-color: var(--main-color);
        }
        .box2{
            --card-hight:300px;
            --main-color: pink;
            background-color: var(--main-color);
            border-radius: 60px;
        }
        .box3{
            background-color: var(--main-color);
        }
    </style>
</head>

<body>
    這是body的文字
    <p>CSS3變數練習, 文字已換色</p>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>

</html>
