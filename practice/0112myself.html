<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myself</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    header{
      background-color: blue;
      display: flex;
      justify-content: space-around;
    }
    .logo{
      width: 100px;
      height: 50px;
      background-color: lightblue;
    }
    .nav .nav-link{
      list-style: none;
      margin: 0;
      padding:0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .nav .nav-link>li{
      width: 100px;
      height: 50px;
      
    }
    .nav .nav-link>li>a{
      text-decoration: none;
      color: #ffffff;
      width: 100%;
      height: 100%;
       display: flex;
       align-items: center;
      
    }

  </style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <div class="menu"></div>
    <div class="nav">
      <ol class="nav-link">
        <li><a href="#">about</a></li>
        <li><a href="#">shop</a></li>
        <li><a href="#">contact</a></li>
      </ol>
    </div>

   
  </header>
</body>
</html>
