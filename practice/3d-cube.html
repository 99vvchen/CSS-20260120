<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3d transform</title>
  <style>
    .cube{
      width: 200px;
      height: 200px;
     position: relative;
     margin: 200px auto; 
     transform-style: preserve-3d;
     transition: all 4s;
    }
    .cube:hover{
       transform: rotateX(-360deg)rotateZ(360deg) ;
    }
    .cube .cube-face{
      width: 100%;
      height: 100%;
  
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      color: #fff;
      text-shadow: 2px 2px 4px rgb(233, 0, 0) ;
    }
    .cube-front{
      background-color: #b83131;
      transform: translateZ(100px);
      }
      .cube-back{
  background-color: #cfdd0f;
  transform: translateZ(-100px) rotateY(180deg);
      }
      .cube-left{
  background-color: #076d35;
  transform: translatex(-100px) rotateY(-90deg);
      }
      .cube-right{
  background-color: #0d79b8;
   transform: translatex(100px) rotateY(90deg);
      }
      .cube-top{
  background-color: #5b0992;
  transform: translateY(-100px) rotateX(90deg);;
      }
      .cube-bottom{
  background-color: #ea03f1;
  transform: translateY(100px) rotateX(90deg);
      }
    
  </style>
</head>
<body>
  <div class="cube">
    <div class="cube-face cube-front">
      <h2>front</h2>
    </div>
    <div class="cube-face cube-back">
      <h2>back</h2>

  
    </div>
    <div class="cube-face cube-left">
      <h2>left</h2>
        
    </div>
    <div class="cube-face cube-right">
      <h2>right</h2>
       
    </div>
    <div class="cube-face cube-top">
      <h2>top</h2>
       
    </div>
    <div class="cube-face cube-bottom">
      <h2>bottom</h2>
        
    </div>
  </div>
</body>
</html>
