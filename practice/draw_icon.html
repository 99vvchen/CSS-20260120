<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>icon</title>
  <style>
    .menu{
      width: 3rem;
      height: 3rem;
      background-color: pink;
      border: 1rem solid red;
      margin: auto;
      position: relative;
    }

    .menu::after{
      content: "";
      width: 1rem;
      height: 0.2rem;
      border-top: 0.6rem double #ffffff;
      border-bottom: 0.2rem solid rgb(255, 255, 255);
      position: absolute;
      top: 1em;
      left: 1em;
    }
  </style>
</head>
<body>
  <div class="menu"></div>
</body>
</html>
