<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex</title>
  <style>
    .container{
      width: 500px;
      height: 500px;
      background-color: pink;
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: baseline;
      flex-wrap: wrap;
     
    }
    .item{
      width: 100px;
      height: 100px;
      /* border-radius: 50%; */
      display: flex;
      justify-content: center;
      align-items: center; 
      font-weight: bold;
      font-size: larger;
      color: antiquewhite;
    }

   
    .item:first-child{
      background-color: #ff2828;
    }
    .item:nth-child(2){
     height: 500px;
      background-color: #357225;
    }
    .item:last-child{
      background-color: #ff6cda;
    } 
    .item:hover{
      background-color: #f0bcbc;
      transition: 0.3s ease;
    }

    .item:active{
      background-color: #672fff;
      transition: 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
  </div>

</body>
</html>
