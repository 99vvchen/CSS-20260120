<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bakery</title>
  <style>
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    header{
      height: 60px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 50px;
      background-color: #ffd3d3;
    }
    .logo img{
      height: 60px;
    }
    ol{
      margin: 0;
      padding: 0;
      list-style-type: none;
       display: flex;
       
       
    }
    ol li{
      width: 80px;
      height: 50px;
       
    }

    ol li:hover{
      background-color: pink;
      transition:0.3s ease;
    }
    ol li a{
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    color: #333;
    text-decoration: none;
    }
    ol li a:hover{
      color: rgb(255, 255, 255);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><img src="./imgs/logo.png" alt=""></div>
    <nav>
      <ol>
        <li><a href="">最新消息</a></li>
        <li><a href="">產品介紹</a></li>
        <li><a href="">聯絡我們</a></li>
      </ol>
    </nav>
  </header>
</body>
</html>
