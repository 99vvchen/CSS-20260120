<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>font&fonawesome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=M+PLUS+1:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<style>
  *{
    margin: 0px;
    padding: 0px;
    font-family: "Josefin Sans","M PLUS 1";
    box-sizing: border-box;
  }

  header{
    width: 100%;
    padding: 10px 16px;
    height: 100px;
    display: flex;
    justify-content: space-around; 
    align-items: center;
    background-color: rgb(82, 122, 182);
  }
  h1{
    font-size: 60px;
    color: salmon;  
    text-align: center;
  }
  header > .btn{
    font-size: 24px;
    color: salmon;
    text-align: center;
  }

  h3{
    font-size: 24px;
    border-bottom: 2px dashed;
    text-align: center;
    margin: 20px;
    padding-bottom: 20px;
    
  }
  h3 i{
    color: blue;
  }
  p{
    margin-top: 60px;
  }
</style>
</head>
<body>
  <header>
    <h1><i class="fa-solid fa-newspaper"></i>今日新聞</h1>
   <div class="btn"> <i class="fa-solid fa-arrow-right-to-bracket"></i>登陸</div>
  </header>
  
  <h3><i class="fa-solid fa-fire"></i>最新消息</h3>

  <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aliquid at quasi omnis officiis reiciendis, id saepe pariatur sint vitae molestiae. Hic reiciendis sequi odit harum aut enim saepe assumenda cum!</p>
</body>
</html>
