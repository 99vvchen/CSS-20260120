<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0110-inline</title>
  <style>
    .box{
      width: 100px;
      height: 100px;
      background-color: pink;
      display: inline-block;
    }

    a{
      text-decoration: none;
      color: #0359fa;
      font-weight:bold;
      background-color: pink;
      border: 1px solid #333;
      border-radius: 10px 10px;
      display: block;
      width: 100px;
      height: 100px;
      text-align: center;
      line-height: 100px;
      margin: 20px 20px;
    
    }
    a:hover{
      background-color: red;
      transition:3s ease;
    }
  </style>
</head>
<body>
  <div class="box"></div>
  <span>hello div</span>
  <ul>
    <li class="item">item1</li>
    <li class="item">item2</li>
    <li class="item">item3</li>
    <li class="item">item4</li>
    <li class="item">item5</li>
  </ul>
  <a href="#">youtube</a>
  <a href="#">instagram</a>
  <a href="#">facebook</a>

  
</body>
</html>
