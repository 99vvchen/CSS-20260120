<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RWD手機先決</title>
  <style>
    /* 手機(480px以下) */
    .nav{
      width: 100%;
      height: 50px;
      background-color: #f5b6b6;
      margin: auto;
    }
    /* 平板(481~820px) */
    @media screen and (min-width:481px) {
      .nav{
        width: 50%;
        background-color:rgb(189, 66, 66);
      }
  }

  /* 電腦1023px */
  @media screen and (min-width:1023px) {
      .nav{
        width: 80%;
        background-color:rgb(42, 14, 197);
      }
  }
  </style>
</head>
<body>
  <div class="nav"></div>
</body>
</html>
