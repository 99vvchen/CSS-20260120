<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grid gallery</title>
  <style>
    .container{
      width: 80%;
      margin: 200px auto;
      display: grid;
      grid-template-columns: repeat(5,1fr);
      grid-template-rows: repeat(3,200px);
      gap: 20px;
    
    }
    .photo-frame{
      background-color: pink;
      height: 200px;
      overflow: hidden;
    }
     .photo-frame img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: all 1s ease;
      
      
     }
    .photo-frame:nth-child(1){
      grid-area: 1 / 1 / 3 / 3;
      height: 420px;
      object-position: top top ;
      
     }
    img:nth-child(1):hover{
      transform: scale(1.5);
     }
     .photo-frame:nth-child(2){
  
      object-fit: cover;
     }
     .photo-frame:nth-child(5){
      grid-area: 2 / 3 / 3 / 5;
     }
     .photo-frame:last-child{
      grid-area:3 / 4 / 4 / 6;
      object-position: bottom bottom;
     }
   
  </style>
</head>
<body>
  <div class="container">
    <div class="photo-frame">
      <img src="imgs/designer.jpg" alt="">
    </div>
    <div class="photo-frame">
      <img src="imgs/flowers1.jpg" alt=""></div>
    <div class="photo-frame">
      <img src="imgs/people2.jpg" alt="">
    </div>
    <div class="photo-frame">
      <img src="imgs/food1.jpg" alt="">
    </div>
    <div class="photo-frame">
      <img src="imgs/food2.jpg" alt="">
    </div>
    <div class="photo-frame">
      <img src="imgs/japan.jpg" alt="">
    </div>
    <div class="photo-frame">
      <img src="imgs/japan3.jpg" alt="">
    </div>
    <div class="photo-frame">
      <img src="imgs/japan1.jpg" alt="">
    </div>
    <div class="photo-frame">
      <img src="imgs/japan2.jpg" alt="">
    </div>
    <div class="photo-frame">
      <img src="imgs/pancake.jpg" alt="">
    </div>
  </div>
</body>
</html>
