<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>RWD主導覽練習檔</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Dosis&family=Mukta:wght@300&display=swap');
        /* font-family: 'Mukta', sans-serif; 
            font-family: 'Dosis';*/
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Mukta', sans-serif;
            }
        /* 電腦 */
        
        header{
            width: 100%;
            height: 60px;
            background-color: lightblue;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding:0 10px;
        }
        .logo{
            width: 100px;
            height: 60px;
            background-color: red;
        }
        .logo a{
            width: 100%;
            height: 100%;
           text-decoration: none;
             color: white;
            font-size: larger;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu-icon i{
            color: white;
            font-size: 1.5rem;
            display: none;
        }
        .navbar ul{
            list-style: none;
            display: flex;
            /* margin: 0; */
        }
        .navbar ul li{
            padding: 0 ;
            background-color: rgb(249, 161, 161);
            
        }
        .navbar ul li a{
            display: block;
            padding:15px 20px;
            transition: 1s;
            text-decoration: none;
             color: white;

        }
        .navbar ul li a:hover{
            color: blue;
        }

        /* 手機 */
        @media screen and (max-width:500px){
            header{
                flex-wrap: wrap;
            }
            .menu-icon i{
                display: block;
            }
            .navbar {
                position: absolute;
                top: 60px;
                width: 100%;
            }
            .navbar ul{
                flex-wrap: wrap;
            }
            .navbar ul li{
                width: 100%;
                border-bottom: 1px dashed #cbcbcb;
            }
            
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="#">mimimi</a></div>
        <div class="menu-icon"><i class="fa-solid fa-bars-staggered"></i></div>
            <nav class="navbar">
                    <ul>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Experience</a></li>
                        <li><a href="#">Portfolio</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
               </nav>
    </header>


</body>

</html>
