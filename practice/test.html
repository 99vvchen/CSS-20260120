<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0110class practice</title>
  <style>
   *{
    color: gray;
    margin: 0;
   }
   
    h1{
      color: blue;
      font-style: italic;
      
    }

    .red{
      color: red;
      font-size: smaller;
    }

    #green{
      color: green;
      font-size: larger;
    }

    #box > p{
      color: red;
      font-size: larger;

    }
    #box p{
      color:green;
    }
    
    input[type="text"]{
      background-color: pink;
      border: 3px solid blue;
      border-radius: 30px;
      height: 30px;
      padding: 10px;
      text-align: center;
    }
    input[type="radio"]{
      width: 30px;
      height: 30px;
    }

    a[href="#"] {
      text-decoration: none;
      color: brown;
      font-size: larger;
      font-weight: bold;
    }
    h1,#box>p,a {
      font-size: 36px;
      color: rgb(214, 214, 44);
    }
 
banto orange.small
  </style>
</head>
<body>
  <h1 class="red" id="green" style="color: purple;">hello</h1>
  <div id="box">
        <p>這是BOX的內容1</p>
        <p>這是BOX的內容2</p>
        <p>這是BOX的內容3</p>
        <div id="box2">
            <p>這是第二層的內容</p>
        </div>
    </div>
    <a href="#" class="item">我是連結</a>
    <ul>
        <li class="item">首頁</li>
        <li class="item">關於我們</li>
        <li class="item">產品介紹</li>
        <li class="item">聯絡我們</li>
    </ul>
    <div class="parent">
        <p>這是直接子元素</p>
        <div>
          <p>這不是直接子元素</p>
        </div>
      </div>
      
    </div>
    <div class="ancestor">
        <div class="parent">
          <p>這是後代元素</p>
          <div>
            <p>這也是後代元素</p>
          </div>
        </div>
      </div>
      
    <input type="text" value="輸入嘎嘎嘎" placeholder="提示詞">
    <input type="radio"> 男 <input type="radio"> 女
</body>
</html>
